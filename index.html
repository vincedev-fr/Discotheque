<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JukeBox TimeMachine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@300;400;600&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0d0f;
      --surface: #141418;
      --surface2: #1c1c22;
      --border: #2a2a35;
      --accent: #e8b84b;
      --accent2: #e05c5c;
      --neon: #4be8c4;
      --text: #d8d4cc;
      --muted: #6b6b7a;
      --playing: #e8b84b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        radial-gradient(ellipse 80% 50% at 20% -10%, rgba(232,184,75,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 110%, rgba(75,232,196,0.05) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── ZONE 1 : HEADER ─────────────────────────────── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 28px 0 20px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    header h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(2.2rem, 5vw, 3.8rem);
      letter-spacing: 0.06em;
      line-height: 1;
      white-space: nowrap;
    }
    .title-jukebox {
      font-family: 'Bebas Neue', sans-serif;
      color: var(--accent);
      letter-spacing: 0.06em;
    }
    .title-timemachine {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: var(--neon);
      letter-spacing: 0.02em;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .action-btn-header {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 7px 14px;
      border-radius: 3px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .action-btn-header:hover { border-color: var(--accent); color: var(--accent); }
    #song-count {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    #global-file-input { display: none; }

    /* Toggle filters button */
    #btn-toggle-filters {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      padding: 6px 12px;
      border-radius: 3px;
      cursor: pointer;
      transition: all .15s;
    }
    #btn-toggle-filters:hover { border-color: var(--accent); color: var(--accent); }

    /* ── MAIN LAYOUT (ZONES 2-5) ────────────────────── */
    .main {
      flex: 1;
      overflow: hidden;
      min-height: 0;
      display: grid;
      grid-template-columns: 30fr 70fr;
      gap: 20px;
      padding: 20px 0 40px;
      align-items: start;
      transition: grid-template-columns 0.3s;
    }
    .main.right-collapsed {
      grid-template-columns: 1fr 0;
    }
    .main.right-collapsed .right-panel { overflow: hidden; width: 0; padding: 0; margin: 0; border: none; }

    .main.right-collapsed .player-controls {
    justify-content: center;  /* centre les boutons sous la vidéo */
    }  

    /* Panneau gauche (lecteur + playlist) : hauteur contrainte, pas de scroll global */
    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.3s;
      height: 100%;
      overflow: hidden;
    }

    /* Panneau droit (filtres + résultats) : scroll interne si nécessaire */
    .right-panel {
      display: flex;
      flex-direction: column;
      gap: 16px;
      transition: all 0.3s;
      height: 100%;
      overflow-y: auto;
    }

    /* ── LEFT PANEL (Zones 4 & 5) ──────────────────── */
    .player-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .playlist-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
    }

    /* Player specific styles */
    .player-header, .playlist-header {
      background: var(--surface2);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--border);
    }
    .player-header .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
    .player-header span, .playlist-header span {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
    }

    #yt-embed-wrap {
      position: relative;
      background: #000;
      width: 100%;
      aspect-ratio: 16 / 9;           /* ratio constant */
      max-height: 45vh;               /* jamais plus de 50% de la hauteur de la fenêtre */
      margin: 0 auto;                 /* centre si la largeur dépasse (optionnel) */
      /*       padding-bottom: 56.25%;   /* Ratio 16:9 */
   }
    #yt-player {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .now-playing {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
    }
    #np-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--accent);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 3px;
    }
    #np-artist {
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #np-year {
      font-size: 0.6rem;
      color: var(--border);
      margin-top: 4px;
      letter-spacing: 0.08em;
    }
    .player-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 14px;
      border-top: 1px solid var(--border);
    }
    .ctrl-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      cursor: pointer;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      padding: 6px 10px;
      transition: all .15s;
      letter-spacing: 0.05em;
    }
    .ctrl-btn:hover { border-color: var(--accent); color: var(--accent); }
    .ctrl-btn.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .ctrl-btn.active-play { background: var(--neon); color: #000; border-color: var(--neon); }
    .ctrl-btn.active-loop { background: var(--accent2); color: #fff; border-color: var(--accent2); }

    /* Playlist card */
    #playlist-ul {
      list-style: none;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      flex: 1;
    }
    #playlist-ul li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      cursor: pointer;
      transition: background .15s;
      font-size: 0.68rem;
    }
    #playlist-ul li:hover { background: rgba(255,255,255,0.04); }
    #playlist-ul li.active {
      background: rgba(232,184,75,0.1);
      border-left: 2px solid var(--accent);
    }
    #playlist-ul li .pl-idx { color: var(--muted); min-width: 20px; font-size: 0.58rem; }
    #playlist-ul li .pl-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
    #playlist-ul li .pl-artist { color: var(--muted); font-size: 0.6rem; white-space: nowrap; margin-right: 8px; }
    #playlist-ul li .pl-remove {
      color: var(--border);
      font-size: 0.75rem;
      padding: 2px 5px;
      border-radius: 3px;
      transition: color .15s;
      line-height: 1;
    }
    #playlist-ul li:hover .pl-remove { color: var(--accent2); }
    .playlist-actions {
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .action-btn {
      flex: 1;
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 7px 4px;
      border-radius: 3px;
      cursor: pointer;
      transition: all .15s;
    }
    .action-btn:hover { border-color: var(--neon); color: var(--neon); }

    /* ── RIGHT PANEL (Zones 2 & 3) ──────────────────── */
    .filters-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 18px;
    }
    .results-card {
      display: flex;
      flex-direction: column;
      flex: 1;
      min-height: 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 14px 18px;
    }
    .filters-title, .results-header .label {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .filters-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr auto;
      gap: 10px;
      align-items: end;
    }
    .filter-group { display: flex; flex-direction: column; gap: 5px; }
    .filter-group label {
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .filter-group input, .filter-group select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.72rem;
      padding: 8px 10px;
      border-radius: 3px;
      outline: none;
      width: 100%;
    }
    .filter-group input:focus, .filter-group select:focus { border-color: var(--accent); }
    .year-range { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .reset-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 8px 14px;
      border-radius: 3px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .reset-btn:hover { border-color: var(--accent2); color: var(--accent2); }

    .year-range input[type="number"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
    .year-range input[type="number"]::-webkit-inner-spin-button,
    .year-range input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .year-range input {
      min-width: 65px;
    }

    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    #results-count { font-size: 0.62rem; color: var(--neon); letter-spacing: 0.08em; }
    .add-all-btn {
      background: none;
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 3px;
      cursor: pointer;
    }
    .add-all-btn:hover { background: var(--accent); color: #000; }

    .table-wrap {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }
    table { width: 100%; border-collapse: collapse; font-size: 0.68rem; }
    thead th {
      background: var(--surface2);
      padding: 9px 10px;
      text-align: left;
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 400;
      position: sticky;
      top: 0;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    thead th:hover { color: var(--accent); }
    thead th.sorted-asc::after { content: ' ↑'; color: var(--accent); }
    thead th.sorted-desc::after { content: ' ↓'; color: var(--accent); }
    tbody tr { border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; transition: background .12s; }
    tbody tr:hover { background: rgba(255,255,255,0.04); }
    tbody tr.playing { background: rgba(232,184,75,0.08); }
    td { padding: 9px 10px; vertical-align: middle; }
    td.t-artist { color: var(--text); font-weight: 600; }
    td.t-title { color: var(--text); font-style: italic; font-family: 'Playfair Display', serif; font-size: 0.75rem; }
    td.t-album { color: var(--muted); font-size: 0.6rem; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    td.t-year { color: var(--muted); text-align: center; }
    td.t-note { text-align: center; }
    .star { color: var(--accent); font-size: 0.75rem; }
    .add-row-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.65rem;
      padding: 3px 9px;
      border-radius: 3px;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }
    .add-row-btn:hover { border-color: var(--neon); color: var(--neon); }
    .add-row-btn.in-playlist { border-color: var(--accent); color: var(--accent); }

    .no-results {
      padding: 30px;
      text-align: center;
      color: var(--muted);
      font-size: 0.7rem;
      letter-spacing: 0.1em;
    }

    #notif {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--surface2);
      border: 1px solid var(--accent);
      color: var(--accent);
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      padding: 10px 18px;
      border-radius: 4px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .3s, transform .3s;
      pointer-events: none;
      z-index: 100;
    }
    #notif.show { opacity: 1; transform: translateY(0); }

    @media (max-width: 900px) {
      .main { grid-template-columns: 1fr; }
      .main.right-collapsed { grid-template-columns: 1fr; }
      .right-panel { display: block; width: auto; }
      .filters-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- ═══════════ ZONE 1 ═══════════ -->
  <header>
    <h1>
      <span class="title-jukebox">JukeBox</span>
      <span class="title-timemachine">TimeMachine</span>
    </h1>
    <div class="header-actions">
      <span id="song-count">0 titres</span>
      <button class="action-btn-header" id="btn-load-global">📂 Charger liste (CSV/JSON)</button>
      <button class="action-btn-header" id="btn-save-global">💾 Sauvegarder liste</button>
      <button id="btn-toggle-filters" title="Réduire/Afficher les filtres">☰ Filtres</button>
    </div>
    <input type="file" id="global-file-input" accept=".csv,.json">
  </header>

  <!-- ═══════════ MAIN (ZONES 2-5) ═══════════ -->
  <div class="main" id="main-layout">
    <!-- LEFT PANEL (Zones 4 & 5) -->
    <div class="left-panel" id="left-panel">
      <!-- Zone 4 : Lecteur -->
      <div class="player-card">
        <div class="player-header">
          <div class="dot" id="player-dot" style="background:var(--muted);box-shadow:none;animation:none"></div>
          <span>Lecteur</span>
        </div>
        <div id="yt-embed-wrap">
          <div id="yt-player"></div>
        </div>
        <div class="now-playing">
          <div id="np-title">— Aucune piste —</div>
          <div id="np-artist"></div>
          <div id="np-year"></div>
        </div>
        <div class="player-controls">
          <button class="ctrl-btn" id="btn-prev" title="Précédent">◂◂</button>
          <button class="ctrl-btn" id="btn-next" title="Suivant">▸▸</button>
          <button class="ctrl-btn" id="btn-autoplay" title="Lecture continue">▶ Auto</button>
          <button class="ctrl-btn" id="btn-loop" title="Répéter le titre">↺ Loop</button>
          <button class="ctrl-btn" id="btn-shuffle" title="Aléatoire">⇄ Shuffle</button>
        </div>
      </div>

      <!-- Zone 5 : Playlist -->
      <div class="playlist-card">
        <div class="playlist-header">
          <span>Playlist en cours</span>
          <span id="playlist-count-badge">0 titre(s)</span>
        </div>
        <ul id="playlist-ul"></ul>
        <div class="playlist-actions">
          <button class="action-btn" id="btn-clear-pl">✕ Vider</button>
          <button class="action-btn" id="btn-save-pl">💾 Sauvegarder</button>
          <button class="action-btn" id="btn-load-pl">📂 Charger</button>
        </div>
        <input type="file" id="pl-file-input" accept=".csv,.json" style="display:none">
      </div>
    </div>

    <!-- RIGHT PANEL (Zones 2 & 3) -->
    <div class="right-panel" id="right-panel">
      <!-- Zone 2 : Filtres -->
      <div class="filters-card">
        <div class="filters-title">Filtres de recherche</div>
        <div class="filters-grid">
          <div class="filter-group">
            <label>Artiste / Titre</label>
            <input type="text" id="f-search" placeholder="ex : phil collins, dancing…">
          </div>
          <div class="filter-group">
            <label>Années</label>
            <div class="year-range">
              <input type="number" id="f-year-from" placeholder="De" min="1950" max="2030">
              <input type="number" id="f-year-to" placeholder="À" min="1950" max="2030">
            </div>
          </div>
          <div class="filter-group">
            <label>Note min.</label>
            <select id="f-note">
              <option value="">Toutes</option>
              <option value="15">≥ 15</option>
              <option value="17">≥ 17</option>
              <option value="18">≥ 18</option>
              <option value="19">≥ 19</option>
              <option value="20">20 seulement</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Album original</label>
            <input type="text" id="f-album" placeholder="ex : thriller…">
          </div>
          <button class="reset-btn" id="btn-reset">↺ Reset</button>
        </div>
      </div>

      <!-- Zone 3 : Résultats -->
      <div class="results-card">
        <div class="results-header">
          <span class="label">Résultats</span>
          <span id="results-count"></span>
          <button class="add-all-btn" id="btn-add-all">+ Tout ajouter</button>
        </div>
        <div class="table-wrap">
          <table id="results-table">
            <thead>
              <tr>
                <th data-col="artist">Artiste</th>
                <th data-col="title">Titre</th>
                <th data-col="album">Album original</th>
                <th data-col="year">Année</th>
                <th data-col="note">Note</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="results-body"></tbody>
          </table>
          <div id="no-results" class="no-results" style="display:none">Aucun résultat pour ces critères.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="notif"></div>

<script>
// ── Data ───────────────────────────────────────────────────────────────────
let allSongs = [];
let filteredSongs = [];
let playlist = [];
let currentIdx = -1;
let shuffleMode = false;
let autoplayMode = false;
let loopMode = false;
let sortCol = 'artist';
let sortDir = 1;

// ── YouTube IFrame API ─────────────────────────────────────────────────────
let ytPlayer = null;
let ytReady = false;
let pendingVideoId = null;

const ytScript = document.createElement('script');
ytScript.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytScript);

window.onYouTubeIframeAPIReady = function() {
  ytPlayer = new YT.Player('yt-player', {
    height: '100%',
    width: '100%',
    videoId: '',
    playerVars: {
      autoplay: 1,
      rel: 0,
      modestbranding: 1,
      playsinline: 1
    },
    events: {
      onReady: function(e) {
        ytReady = true;
        if (pendingVideoId) {
          e.target.loadVideoById(pendingVideoId);
          pendingVideoId = null;
        }
      },
      onStateChange: function(e) {
        if (e.data === YT.PlayerState.ENDED) {
          if (loopMode) {
            ytPlayer.seekTo(0);
            ytPlayer.playVideo();
          } else if (autoplayMode) {
            nextSong();
          }
        }
      },
      onError: function(e) {
        if (autoplayMode || loopMode) {
          setTimeout(() => nextSong(), 1500);
          showNotif('Vidéo indisponible, titre suivant…');
        }
      }
    }
  });
};

function loadVideo(ytid) {
  if (!ytid) return;
  if (ytReady && ytPlayer) {
    ytPlayer.loadVideoById(ytid);
  } else {
    pendingVideoId = ytid;
  }

// ── CSV/JSON Parser ────────────────────────────────────────────────────────
function parseCSV(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(Boolean);
  const songs = [];
  const seen = new Set();
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(';');
    if (cols.length < 8) continue;
    const artist = (cols[0] || '').trim();
    const title  = (cols[2] || '').trim();
    const dur    = (cols[3] || '').trim();
    let   year   = (cols[4] || '').trim();
    const album  = (cols[5] || '').trim();
    let   note   = parseInt(cols[6]) || 0;
    let   ytid   = (cols[7] || '').trim().replace(/^\//, '');
    const order  = (cols[8] || '').trim();

    if (!artist || !title || !ytid) continue;
    if (!/^[A-Za-z0-9_\-]{6,15}$/.test(ytid)) continue;

    const key = `${artist.toLowerCase()}|${title.toLowerCase()}|${ytid}`;
    if (seen.has(key)) continue;
    seen.add(key);

    if (year === '?' || year === '') year = '?';
    if (note === 1) note = null;
    const albumClean = (album === '_' || album === '') ? '' : album.replace(/^"|"$/g, '').trim();

    songs.push({ artist, title, duration: dur, year, album: albumClean, note, ytid, order: order || '' });
  }
  return songs;
}

function parseJSON(text) {
  const data = JSON.parse(text);
  if (!Array.isArray(data)) throw new Error('JSON non reconnu');
  const songs = [];
  const seen = new Set();
  for (const item of data) {
    const artist = (item.Interpretes || item.interpretes || item.artist || '').trim();
    const title  = (item.Titres || item.titres || item.title || '').trim();
    const dur    = (item.Duree || item.duree || item.duration || '').trim();
    let   year   = (item.Annee || item.annee || item.year || '').toString().trim();
    const album  = (item['Album original'] || item.album || '').trim();
    let   note   = parseInt(item.Note || item.note) || 0;
    let   ytid   = (item['Lien youtube'] || item['lien youtube'] || item.ytid || '').trim().replace(/^\//, '');
    const order  = (item.Ordre || item.ordre || '').toString().trim();

    if (!artist || !title || !ytid) continue;
    if (!/^[A-Za-z0-9_\-]{6,15}$/.test(ytid)) continue;
    const key = `${artist.toLowerCase()}|${title.toLowerCase()}|${ytid}`;
    if (seen.has(key)) continue;
    seen.add(key);

    if (year === '?' || year === '') year = '?';
    if (note === 1) note = null;
    const albumClean = (album === '_' || album === '') ? '' : album.replace(/^"|"$/g, '').trim();
    songs.push({ artist, title, duration: dur, year, album: albumClean, note, ytid, order: order || '' });
  }
  return songs;
}

function parseFile(content, fileName) {
  if (fileName.endsWith('.json') || content.trim().startsWith('[') || content.trim().startsWith('{')) {
    try { return parseJSON(content); } catch(e) {
      showNotif('JSON invalide, tentative CSV…');
    }
  }
  return parseCSV(content);
}

// ── Render helpers ─────────────────────────────────────────────────────────
function noteStars(n) {
  if (!n) return '<span style="color:var(--border)">—</span>';
  if (n >= 20) return '<span class="star">★★★</span>';
  if (n >= 17) return '<span class="star">★★</span><span style="color:var(--border)">★</span>';
  if (n >= 15) return '<span class="star">★</span><span style="color:var(--border)">★★</span>';
  return `<span style="color:var(--muted);font-size:.6rem">${n}</span>`;
}

function isInPlaylist(song) {
  return playlist.some(p => p.ytid === song.ytid && p.title === song.title);
}

function renderResults() {
  const tbody = document.getElementById('results-body');
  const noRes = document.getElementById('no-results');
  document.getElementById('results-count').textContent = `${filteredSongs.length} titre(s)`;

  if (!filteredSongs.length) {
    tbody.innerHTML = '';
    noRes.style.display = 'block';
    return;
  }
  noRes.style.display = 'none';

  tbody.innerHTML = filteredSongs.map((s, i) => {
    const inPl = isInPlaylist(s);
    const isPlaying = currentIdx >= 0 && playlist[currentIdx] &&
      playlist[currentIdx].ytid === s.ytid && playlist[currentIdx].title === s.title;
    return `<tr class="${isPlaying ? 'playing' : ''}" data-i="${i}">
      <td class="t-artist">${esc(s.artist)}</td>
      <td class="t-title">${esc(s.title)}</td>
      <td class="t-album">${esc(s.album)}</td>
      <td class="t-year">${s.year}</td>
      <td class="t-note">${noteStars(s.note)}</td>
      <td><button class="add-row-btn ${inPl ? 'in-playlist' : ''}" data-i="${i}">${inPl ? '✓ Ajouté' : '+ Ajouter'}</button></td>
    </tr>`;
  }).join('');
}

function renderPlaylist() {
  const ul = document.getElementById('playlist-ul');
  document.getElementById('playlist-count-badge').textContent = `${playlist.length} titre(s)`;
  if (!playlist.length) {
    ul.innerHTML = '<li style="color:var(--muted);font-size:.65rem;padding:14px;text-align:center;cursor:default">Playlist vide</li>';
    return;
  }
  ul.innerHTML = playlist.map((s, i) => `
    <li class="${i === currentIdx ? 'active' : ''}" data-pl-i="${i}">
      <span class="pl-idx">${i + 1}</span>
      <span class="pl-title">${esc(s.title)}</span>
      <span class="pl-artist">${esc(s.artist)}</span>
      <span class="pl-remove" data-remove="${i}">✕</span>
    </li>`).join('');
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Filtering & Sorting ───────────────────────────────────────────────────
function applyFilters() {
  const q     = document.getElementById('f-search').value.toLowerCase().trim();
  const yFrom = parseInt(document.getElementById('f-year-from').value) || 0;
  const yTo   = parseInt(document.getElementById('f-year-to').value) || 9999;
  const nMin  = document.getElementById('f-note').value;
  const album = document.getElementById('f-album').value.toLowerCase().trim();

  // Détecter si une plage de dates a été explicitement saisie
  const hasYearFilter = document.getElementById('f-year-from').value !== '' || 
                        document.getElementById('f-year-to').value !== '';

  filteredSongs = allSongs.filter(s => {
    if (q && !s.artist.toLowerCase().includes(q) && !s.title.toLowerCase().includes(q)) return false;
    
    // Gestion des années
    const yr = parseInt(s.year);
    const hasValidYear = !isNaN(yr);
    if (hasYearFilter) {
      // Si plage de dates demandée, on exclut les pistes sans année valide
      if (!hasValidYear) return false;
      if (yFrom > 0 && yr < yFrom) return false;
      if (yTo > 0 && yr > yTo) return false;
    } else {
      // Pas de filtre année : on garde tout (y compris les "?")
      // (rien à faire)
    }

    if (nMin) {
      if (!s.note) return false;
      if (nMin === '20' && s.note < 20) return false;
      if (nMin !== '20' && s.note < parseInt(nMin)) return false;
    }
    if (album && !s.album.toLowerCase().includes(album)) return false;
    return true;
  });

  filteredSongs.sort((a, b) => {
    let av = a[sortCol], bv = b[sortCol];
    if (sortCol === 'year') { av = parseInt(av)||0; bv = parseInt(bv)||0; }
    if (sortCol === 'note') { av = av||0; bv = bv||0; }
    if (av < bv) return -sortDir;
    if (av > bv) return sortDir;
    return 0;
  });

  renderResults();
}

// ── Player ────────────────────────────────────────────────────────────────
function playSong(idx) {
  if (idx < 0 || idx >= playlist.length) return;
  currentIdx = idx;
  const s = playlist[idx];
  loadVideo(s.ytid);
  document.getElementById('np-title').textContent = s.title;
  document.getElementById('np-artist').textContent = s.artist;
  document.getElementById('np-year').textContent = s.year && s.year !== '?' ? s.year : '';
  const dot = document.getElementById('player-dot');
  dot.style.background = 'var(--accent)';
  dot.style.boxShadow = '0 0 6px var(--accent)';
  dot.style.animation = 'pulse 2s infinite';
  renderPlaylist();
  renderResults();
  setTimeout(() => {
    const active = document.querySelector('#playlist-ul li.active');
    if (active) active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }, 50);
}

function playFromFiltered(idx) {
  const s = filteredSongs[idx];
  if (!s) return;
  const plIdx = playlist.findIndex(p => p.ytid === s.ytid && p.title === s.title);
  if (plIdx !== -1) { playSong(plIdx); return; }
  playlist.push(s);
  renderPlaylist();
  playSong(playlist.length - 1);
}

function addSong(s) {
  if (isInPlaylist(s)) { showNotif('Déjà dans la playlist'); return; }
  playlist.push(s);
  renderPlaylist();
  renderResults();
  showNotif(`« ${s.title} » ajouté`);
}

// ── Controls ──────────────────────────────────────────────────────────────
document.getElementById('btn-prev').addEventListener('click', () => {
  if (!playlist.length) return;
  const prev = (currentIdx - 1 + playlist.length) % playlist.length;
  playSong(prev);
});
document.getElementById('btn-next').addEventListener('click', nextSong);

function nextSong() {
  if (!playlist.length) return;
  let next;
  if (shuffleMode) {
    do { next = Math.floor(Math.random() * playlist.length); }
    while (playlist.length > 1 && next === currentIdx);
  } else {
    next = (currentIdx + 1) % playlist.length;
  }
  playSong(next);
}

document.getElementById('btn-autoplay').addEventListener('click', function() {
  autoplayMode = !autoplayMode;
  if (autoplayMode) loopMode = false;
  this.classList.toggle('active-play', autoplayMode);
  document.getElementById('btn-loop').classList.toggle('active-loop', false);
  showNotif(autoplayMode ? '▶ Lecture continue activée' : '▶ Lecture continue désactivée');
});

document.getElementById('btn-loop').addEventListener('click', function() {
  loopMode = !loopMode;
  if (loopMode) autoplayMode = false;
  this.classList.toggle('active-loop', loopMode);
  document.getElementById('btn-autoplay').classList.toggle('active-play', false);
  showNotif(loopMode ? '↺ Répétition activée' : '↺ Répétition désactivée');
});

document.getElementById('btn-shuffle').addEventListener('click', function() {
  shuffleMode = !shuffleMode;
  this.classList.toggle('active', shuffleMode);
  showNotif(shuffleMode ? '⇄ Shuffle activé' : '⇄ Shuffle désactivé');
});

// ── Playlist interactions ─────────────────────────────────────────────────
document.getElementById('playlist-ul').addEventListener('click', e => {
  const li = e.target.closest('li[data-pl-i]');
  const rm = e.target.closest('[data-remove]');
  if (rm) {
    const i = parseInt(rm.dataset.remove);
    playlist.splice(i, 1);
    if (currentIdx >= playlist.length) currentIdx = playlist.length - 1;
    else if (currentIdx > i) currentIdx--;
    renderPlaylist();
    renderResults();
    return;
  }
  if (li) playSong(parseInt(li.dataset.plI));
});

// ── Results interactions ──────────────────────────────────────────────────
document.getElementById('results-body').addEventListener('click', e => {
  const btn = e.target.closest('.add-row-btn');
  const row = e.target.closest('tr[data-i]');
  if (btn) {
    const i = parseInt(btn.dataset.i);
    addSong(filteredSongs[i]);
    return;
  }
  if (row) {
    playFromFiltered(parseInt(row.dataset.i));
  }
});

// ── Sort headers ──────────────────────────────────────────────────────────
document.querySelectorAll('thead th[data-col]').forEach(th => {
  th.addEventListener('click', () => {
    const col = th.dataset.col;
    if (sortCol === col) sortDir *= -1;
    else { sortCol = col; sortDir = 1; }
    document.querySelectorAll('thead th').forEach(h => h.classList.remove('sorted-asc','sorted-desc'));
    th.classList.add(sortDir === 1 ? 'sorted-asc' : 'sorted-desc');
    applyFilters();
  });
});

// ── Add all ───────────────────────────────────────────────────────────────
document.getElementById('btn-add-all').addEventListener('click', () => {
  let added = 0;
  filteredSongs.forEach(s => {
    if (!isInPlaylist(s)) { playlist.push(s); added++; }
  });
  renderPlaylist();
  renderResults();
  showNotif(`${added} titre(s) ajouté(s) à la playlist`);
});

// ── Clear / Save / Load playlist ──────────────────────────────────────────
document.getElementById('btn-clear-pl').addEventListener('click', () => {
  playlist = []; currentIdx = -1;
  if (ytReady && ytPlayer) ytPlayer.stopVideo();
  document.getElementById('np-title').textContent = '— Aucune piste —';
  document.getElementById('np-artist').textContent = '';
  document.getElementById('np-year').textContent = '';
  const dot = document.getElementById('player-dot');
  dot.style.background = 'var(--muted)'; dot.style.boxShadow = 'none'; dot.style.animation = 'none';
  renderPlaylist(); renderResults();
});

document.getElementById('btn-save-pl').addEventListener('click', () => {
  if (!playlist.length) { showNotif('Playlist vide'); return; }
  const lines = ['Artiste;Titre;Année;Note;YouTube ID'];
  playlist.forEach(s => lines.push(`"${s.artist}";"${s.title}";${s.year};${s.note||''};${s.ytid}`));
  const blob = new Blob([lines.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'ma_playlist.csv';
  a.click();
  showNotif('Playlist exportée en CSV');
});

document.getElementById('btn-load-pl').addEventListener('click', () => {
  document.getElementById('pl-file-input').click();
});
document.getElementById('pl-file-input').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const newPl = parseFile(e.target.result, file.name);
      if (!newPl.length) {
        showNotif('Aucune piste valide trouvée');
        return;
      }
      playlist = newPl;
      currentIdx = -1;
      renderPlaylist();
      renderResults();
      showNotif(`${playlist.length} titre(s) chargés dans la playlist`);
    } catch(err) {
      showNotif('Erreur lors du chargement de la playlist');
    }
  };
  reader.readAsText(file, 'utf-8');
  this.value = '';
});

// ── Global DB load ────────────────────────────────────────────────────────
document.getElementById('btn-load-global').addEventListener('click', () => {
  document.getElementById('global-file-input').click();
});
document.getElementById('global-file-input').addEventListener('change', function() {
  const file = this.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    allSongs = parseFile(e.target.result, file.name);
    document.getElementById('song-count').textContent = `${allSongs.length} titres`;
    applyFilters();
    showNotif(`${allSongs.length} titres chargés`);
  };
  reader.readAsText(file, 'utf-8');
  this.value = '';
});

// ── Global DB save ────────────────────────────────────────────────────────
document.getElementById('btn-save-global').addEventListener('click', () => {
  if (!allSongs.length) { showNotif('Aucune donnée à sauvegarder'); return; }
  const headers = 'Interpretes;N°;Titres;Duree;Annee;Album original;Note;Lien youtube;Ordre';
  const rows = allSongs.map(s => 
    `"${s.artist}";"${s.order||''}";"${s.title}";"${s.duration}";${s.year};"${s.album}";${s.note||''};${s.ytid};${s.order||''}`
  );
  const blob = new Blob([headers + '\n' + rows.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jukebox_db.csv';
  a.click();
  showNotif('Base globale sauvegardée (CSV)');
});

// ── Filters events ────────────────────────────────────────────────────────
['f-search','f-year-from','f-year-to','f-note','f-album'].forEach(id => {
  document.getElementById(id).addEventListener('input', applyFilters);
  document.getElementById(id).addEventListener('change', applyFilters);

document.getElementById('btn-reset').addEventListener('click', () => {
  document.getElementById('f-search').value = '';
  document.getElementById('f-year-from').value = '';
  document.getElementById('f-year-to').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('f-album').value = '';
  applyFilters();
});

// ── Layout toggles ────────────────────────────────────────────────────────
document.getElementById('btn-toggle-filters').addEventListener('click', () => {
  const main = document.getElementById('main-layout');
  main.classList.toggle('right-collapsed');
  const btn = document.getElementById('btn-toggle-filters');
  if (main.classList.contains('right-collapsed')) {
    btn.innerHTML = '☰ Filtres (off)';
  } else {
    btn.innerHTML = '☰ Filtres';
  }
});

// ── Notification ──────────────────────────────────────────────────────────
let notifTimer;
function showNotif(msg) {
  const n = document.getElementById('notif');
  n.textContent = msg;
  n.classList.add('show');
  clearTimeout(notifTimer);
  notifTimer = setTimeout(() => n.classList.remove('show'), 2200);
}

// ── Init ──────────────────────────────────────────────────────────────────
function init() {
  allSongs = parseCSV(DEFAULT_CSV);
  document.getElementById('song-count').textContent = `${allSongs.length} titres`;

  try {
    const saved = localStorage.getItem('timemachine_playlist');
    if (saved) {
      playlist = JSON.parse(saved);
      currentIdx = parseInt(localStorage.getItem('timemachine_currentIdx')) || -1;
      renderPlaylist();
    }
  } catch(e) {}

  applyFilters();
}

// Auto-save playlist to localStorage
const originalRenderPlaylist = renderPlaylist;
renderPlaylist = function() {
  originalRenderPlaylist();
  try {
    localStorage.setItem('timemachine_playlist', JSON.stringify(playlist));
    localStorage.setItem('timemachine_currentIdx', currentIdx);
  } catch(e) {}
};

init();
